<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ead8" />
    <meta name="description" content="NearSeat: season memberships that own their own NEAR accounts. Your seat now earns." />
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the other one.
      try { if (localStorage.getItem("nearseat-theme") === "dark") { document.documentElement.dataset.theme = "dark"; document.querySelector('meta[name="theme-color"]').content = "#140d10"; } } catch (e) {}
    </script>
    <link rel="icon" href="/crest.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>NearSeat · Illia Stars United</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
