# Render blueprint: one free web service running the relayer, with the keeper
# loop in the same process (RUN_KEEPER=1), since free plans have no workers.
# Set the *_PRIVATE_KEY secrets in the Render dashboard (never in the repo).
# Key env var names come from the account id: relayer.nearseat.testnet →
# RELAYER_NEARSEAT_TESTNET_PRIVATE_KEY.
services:
  - type: web
    name: nearseat-relayer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start -w relayer
    healthCheckPath: /health
    envVars:
      - { key: NEAR_NETWORK, value: testnet }
      - { key: CONTRACT_ID, value: nearseat.testnet }
      - { key: TUSDC_ID, value: tusdc.nearseat.testnet }
      - { key: RELAYER_ID, value: relayer.nearseat.testnet }
      - { key: GATE_ID, value: gate.nearseat.testnet }
      - { key: RUN_KEEPER, value: "1" }
      - { key: RELAYER_ALLOWED_ORIGIN, sync: false }
      - { key: RELAYER_NEARSEAT_TESTNET_PRIVATE_KEY, sync: false }
      - { key: GATE_NEARSEAT_TESTNET_PRIVATE_KEY, sync: false }
