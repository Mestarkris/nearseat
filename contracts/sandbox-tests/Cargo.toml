[package]
name = "sandbox-tests"
version = "1.0.0"
description = "End-to-end NearSeat tests on a local NEAR sandbox (real receipts, real callbacks)"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
near-workspaces.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2 = "0.10"
bs58 = "0.5"
# near-workspaces → near-jsonrpc-client enables native-tls; vendoring OpenSSL means
# no system libssl-dev is needed to run the tests.
openssl = { version = "0.10", features = ["vendored"] }
