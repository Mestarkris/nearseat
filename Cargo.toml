[workspace]
resolver = "2"
members = [
    "contracts/vault",
    "contracts/tusdc",
    "contracts/nearseat",
    "contracts/mock-ft",
    "contracts/sandbox-tests",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/REPLACE_ME/nearseat"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
